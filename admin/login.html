<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>管理后台登录 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=343ca1f">
  <link rel="stylesheet" href="/css/base.css?v=343ca1f">
  <link rel="stylesheet" href="/css/layout.css?v=343ca1f">
  <link rel="stylesheet" href="/css/components.css?v=343ca1f">
  <link rel="stylesheet" href="/css/pages.css?v=343ca1f">
  <link rel="stylesheet" href="css/admin.css?v=343ca1f">
</head>
<body class="admin-login-body">

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main" class="admin-login-main">

<div class="admin-login-panel">
  <div class="admin-login-brand">
    <img src="../assets/img/logo-256.webp" alt="" width="40" height="40">
    <div>
      <div class="admin-login-title">UEMCraft 管理后台</div>
      <div class="admin-login-sub">应急管理大学 Minecraft 同好会</div>
    </div>
  </div>

  <div id="loginPrompt" class="admin-login-form">
    <p class="admin-login-desc">使用皮肤站账号登录。首次登录的账号将自动成为超级管理员，其余账号为普通用户。</p>
    <a class="btn btn-primary" href="/api/auth.php?action=login&amp;return=/admin/">使用皮肤站账号登录</a>
    <button type="button" class="btn btn-ghost" id="logoutBtn" style="display:none;">退出当前账号</button>
    <p class="admin-login-hint">还没有账号？<a href="https://skin.uemcraft.cn/auth/register" target="_blank" rel="noopener">注册皮肤站账号</a></p>
  </div>

  <span id="loginMessage" class="wall-form-message" role="status" aria-live="polite"></span>

  <div class="admin-login-foot">
    <a href="/index.html" class="admin-login-back">← 返回网站</a>
    <div class="theme-options admin-login-theme">
      <button class="theme-option" data-theme="light" title="亮色模式" aria-label="亮色模式"><span class="iconfont-theme icon-sun" aria-hidden="true"></span></button>
      <button class="theme-option" data-theme="dark" title="深色模式" aria-label="深色模式"><span class="iconfont-theme icon-moon" aria-hidden="true"></span></button>
    </div>
  </div>
</div>

</main>

</body>
</html>
