<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>管理后台登录 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Header ====== -->
<header class="site-header" role="banner">
  <div class="header-inner">
    <a href="../index.html" class="header-logo" aria-label="UEMCraft 首页">
      <img src="../assets/img/logo-256.webp" alt="UEMCraft Logo" width="40" height="40">
      <span class="logo-text">
        <span class="logo-cn">应大MC同好会</span>
        <span class="logo-en">UEMCraft</span>
      </span>
    </a>
    <nav class="header-nav" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="../about.html">关于我们</a>
      <a href="../news/">资讯动态</a>
      <a href="../events.html">活动中心</a>
      <a href="../works/">作品展示</a>
      <a href="../wall/">留言墙</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" aria-label="切换深色/亮色模式" title="切换主题">
        <span class="iconfont-theme icon-sun" aria-hidden="true"></span>
        <span class="iconfont-theme icon-moon" aria-hidden="true"></span>
      </button>
      <button class="hamburger" aria-label="菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<nav class="mobile-nav" aria-label="移动端导航">
  <a href="../index.html">首页</a>
  <a href="../about.html">关于我们</a>
  <a href="../events.html">活动中心</a>
  <a href="../news/">资讯动态</a>
  <a href="../works/">作品展示</a>
  <a href="../wall/">留言墙</a>
</nav>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1>管理后台</h1>
    <p class="hero-sub">UEMCraft 内容管理</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="../index.html">首页</a> <span>/</span> <span>管理后台</span> <span>/</span> <span>登录</span>
    </nav>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div class="admin-token-wrap">
      <h2 class="admin-title">管理员登录</h2>
      <p class="text-muted">输入服务器上配置的 <code>ADMIN_TOKEN</code> 以进入管理后台。</p>
      <form id="loginForm" class="admin-token-form" novalidate>
        <input type="password" id="tokenInput" class="form-input" placeholder="管理员令牌" autocomplete="off" required>
        <button type="submit" class="btn btn-primary" id="loginBtn">进入管理</button>
      </form>
      <span id="loginMessage" class="wall-form-message" role="status" aria-live="polite"></span>
    </div>
  </div>
</section>

</main>

<!-- ====== Footer ====== -->
<footer class="site-footer" role="contentinfo">
  <div class="footer-bottom">
    <span>&copy; <span id="year"></span> 应急管理大学 Minecraft 同好会 · UEMCraft</span>
    <span>Minecraft 是 Mojang AB 的商标 · 本站为社群非商业用途</span>
  </div>
</footer>

<script defer src="../js/main.js"></script>
<script defer src="../js/admin-auth.js"></script>
<script defer src="../js/admin.js"></script>
</body>
</html>
