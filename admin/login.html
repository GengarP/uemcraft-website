<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>管理后台登录 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main" class="admin-login-main">

<div class="admin-login-panel">
  <div class="admin-login-brand">
    <img src="../assets/img/logo-256.webp" alt="" width="40" height="40">
    <div>
      <div class="admin-login-title">UEMCraft 管理后台</div>
      <div class="admin-login-sub">应急管理大学 Minecraft 同好会</div>
    </div>
  </div>

  <form id="loginForm" class="admin-login-form" novalidate>
    <label class="admin-login-label" for="tokenInput">管理员令牌</label>
    <input type="password" id="tokenInput" class="form-input" placeholder="输入 ADMIN_TOKEN" autocomplete="off" required>
    <button type="submit" class="btn btn-primary" id="loginBtn">进入管理</button>
  </form>

  <span id="loginMessage" class="wall-form-message" role="status" aria-live="polite"></span>

  <div class="admin-login-foot">
    <a href="/index.html" class="admin-login-back">← 返回网站</a>
    <div class="theme-options admin-login-theme">
      <button class="theme-option" data-theme="light" title="亮色模式" aria-label="亮色模式"><span class="iconfont-theme icon-sun" aria-hidden="true"></span></button>
      <button class="theme-option" data-theme="dark" title="深色模式" aria-label="深色模式"><span class="iconfont-theme icon-moon" aria-hidden="true"></span></button>
    </div>
  </div>
</div>

</main>


<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/admin-auth.js"></script>
<script defer src="/js/admin-login.js"></script>
</body>
</html>
