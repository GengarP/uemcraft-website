  <title id="pageTitle">编辑新闻 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

</head>

      <img src="/assets/img/minecraft_title.png" alt="UEMCraft" class="header-logo-img">
    </a>
    <nav class="header-nav" aria-label="主导航">
      <a href="/index.html">首页</a>
      <div class="nav-dropdown"><a href="/about.html" class="nav-drop-trigger">关于我们</a><div class="nav-drop-menu"><a href="/join.html">加入我们</a><a href="/gallery/">作品展示</a><a href="https://skin.uemcraft.cn/" target="_blank" rel="noopener">皮肤站</a></div></div>
      <a href="/news/">资讯动态</a>
      <a href="/events.html">活动中心</a>
      <a href="/wall/">留言墙</a>
    </nav>
    <div class="header-actions">
      <div class="settings-wrapper">
        <button class="settings-toggle" aria-label="设置" title="设置">
          <img src="/assets/svg/setting.svg" alt="" width="20" height="20" class="settings-icon">
        </button>
        <div class="settings-panel" aria-hidden="true">
          <div class="settings-group">
            <span class="settings-label">外观</span>
            <div class="theme-options">
              <button class="theme-option" data-theme="light" title="亮色模式">
                <span class="iconfont-theme icon-sun" aria-hidden="true"></span>
              </button>
              <button class="theme-option" data-theme="dark" title="深色模式">
                <span class="iconfont-theme icon-moon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="settings-group">
            <span class="settings-label">背景纹理</span>
            <div class="texture-grid">
              <button class="texture-option" data-texture="none" title="无纹理">无</button>
              <button class="texture-option" data-texture="bricks" title="砖块">
                <img src="/assets/img/background_textures/bricks.png" alt="砖块">
              </button>
              <button class="texture-option" data-texture="cobblestone" title="圆石">
                <img src="/assets/img/background_textures/cobblestone.png" alt="圆石">
              </button>
              <button class="texture-option" data-texture="dirt" title="泥土">
                <img src="/assets/img/background_textures/dirt.png" alt="泥土">
              </button>
              <button class="texture-option" data-texture="end_stone" title="末地石">
                <img src="/assets/img/background_textures/end_stone.png" alt="末地石">
              </button>
              <button class="texture-option" data-texture="stone" title="石头">
                <img src="/assets/img/background_textures/stone.png" alt="石头">
              </button>
              <button class="texture-option" data-texture="stone_bricks" title="石砖">
                <img src="/assets/img/background_textures/stone_bricks.png" alt="石砖">
              </button>
            </div>
          </div>
        </div>
      </div>
      <button class="hamburger" aria-label="菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1 id="heroTitle">新建新闻</h1>
    <p class="hero-sub" id="heroSub">填写新闻信息并保存</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <a href="news.html">新闻</a> <span>/</span> <span id="crumbAction">新建</span>
    </nav>
  </div>
</section>

<section class="section">
  <div class="container">
    <form id="newsForm" class="admin-edit-form" novalidate>
      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputTitle">标题 <span class="required">*</span></label>
          <input type="text" id="inputTitle" class="form-input" placeholder="新闻标题" required maxlength="255">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSlug">Slug <span class="required">*</span></label>
          <input type="text" id="inputSlug" class="form-input" placeholder="url-slug（字母、数字、连字符）" required pattern="[a-z0-9\-]+">
          <small class="form-help">用于 URL，如 <code>my-article</code></small>
        </div>
        <div class="form-group">
          <label for="inputDate">日期 <span class="required">*</span></label>
          <input type="date" id="inputDate" class="form-input" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputAuthor">作者</label>
          <input type="text" id="inputAuthor" class="form-input" placeholder="作者名" maxlength="100">
        </div>
        <div class="form-group">
          <label for="inputStatus">状态</label>
          <select id="inputStatus" class="form-input">
            <option value="draft">草稿</option>
            <option value="published">已发布</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputPinned">置顶</label>
          <select id="inputPinned" class="form-input">
            <option value="0">否</option>
            <option value="1">是</option>
          </select>
          <small class="form-help">置顶资讯在列表中优先显示</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputCover">封面图 URL</label>
          <input type="text" id="inputCover" class="form-input" placeholder="/assets/img/news/xxx.jpg">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputCoverCaption">封面说明</label>
          <input type="text" id="inputCoverCaption" class="form-input" placeholder="图片说明文字" maxlength="500">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputTags">标签</label>
          <input type="text" id="inputTags" class="form-input" placeholder="用逗号分隔，如：活动, 基建, 功能">
          <small class="form-help">多个标签用逗号分隔</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputExcerpt">摘要</label>
          <textarea id="inputExcerpt" class="form-textarea" rows="3" placeholder="文章摘要，用于列表预览" maxlength="500"></textarea>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputContent">正文 <span class="required">*</span></label>
          <textarea id="inputContent" class="form-textarea admin-content-textarea" rows="20" placeholder="Markdown 格式正文"></textarea>
          <small class="form-help">支持 Markdown 语法</small>
        </div>
      </div>

      <span id="formMessage" class="wall-form-message" role="status" aria-live="polite"></span>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        <a href="news.html" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</section>
