<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>图片管理 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>



<!-- ====== Admin Nav ====== -->
<div class="admin-nav">
  <div class="container admin-nav-inner">
    <a href="index.html" class="admin-nav-link">仪表盘</a>
    <a href="news.html" class="admin-nav-link">新闻管理</a>
    <a href="events.html" class="admin-nav-link">活动管理</a>
    <a href="gallery.html" class="admin-nav-link">作品管理</a>
    <a href="servers.html" class="admin-nav-link">服务器管理</a>
    <a href="images.html" class="admin-nav-link is-active">图片管理</a>
    <a href="wall.html" class="admin-nav-link">留言墙管理</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
  </div>
</div>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1>图片管理</h1>
    <p class="hero-sub">浏览、上传、管理图片资源</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <span>图片</span>
    </nav>
  </div>
</section>

<section class="section">
  <div class="container">

    <!-- 目录切换 Tab -->
    <div class="admin-tabs" id="folderTabs">
      <button class="admin-tab is-active" data-folder="news">新闻/活动图片</button>
      <button class="admin-tab" data-folder="gallery">作品展示图片</button>
    </div>

    <!-- 上传区域 -->
    <div class="admin-upload-zone" id="uploadZone">
      <div class="admin-upload-inner">
        <span class="admin-upload-icon">📁</span>
        <p>拖拽图片到此处，或 <label for="fileInput" class="admin-upload-link">点击选择文件</label></p>
        <small class="text-muted">支持 jpg / png / gif / webp / svg，单文件最大 10MB</small>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <div class="admin-upload-progress" id="uploadProgress" style="display:none;">
        <div class="admin-upload-bar"><div class="admin-upload-bar-inner" id="uploadBar"></div></div>
        <span id="uploadStatus" class="text-muted"></span>
      </div>
    </div>

    <!-- 图片网格 -->
    <div class="admin-toolbar" style="margin-top:var(--space-lg);">
      <span class="text-muted">共 <strong id="totalCount">0</strong> 张图片</span>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ 刷新</button>
    </div>

    <div id="imagesGrid" class="admin-images-grid">
      <div class="wall-loading">正在加载图片…</div>
    </div>

  </div>
</section>

</main>



<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/admin-auth.js"></script>
<script defer src="/js/admin-list.js"></script>
</body>
</html>
