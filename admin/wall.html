<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>留言墙管理 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
  <link rel="stylesheet" href="css/admin.css">
</head>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1>留言墙管理</h1>
    <p class="hero-sub">审核 / 编辑 / 删除留言</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <span>留言墙</span>

<!-- Admin Panel -->
<section class="section" id="adminPanelSection">
  <div class="container">

    <div class="admin-toolbar">
      <div class="admin-tabs" role="tablist" aria-label="状态筛选">
        <button class="admin-tab is-active" data-status="all">全部</button>
        <button class="admin-tab" data-status="approved">已通过</button>
        <button class="admin-tab" data-status="hidden">已屏蔽</button>
      </div>
      <div class="admin-toolbar-right">
        <span class="text-muted">共 <strong id="adminTotalCount">0</strong> 条</span>
        <button class="btn btn-ghost btn-sm" id="adminLogoutBtn">退出</button>
      </div>
    </div>

    <div id="adminList" class="admin-list">
      <div class="wall-loading">正在加载留言…</div>
    </div>

    <div id="adminPagination" class="wall-pagination" style="display:none;">
      <button class="btn btn-ghost btn-sm" id="adminPrevPage" disabled>‹ 上一页</button>
      <span id="adminPageInfo" class="wall-page-info"></span>
      <button class="btn btn-ghost btn-sm" id="adminNextPage" disabled>下一页 ›</button>
    </div>

  </div>
</section>
