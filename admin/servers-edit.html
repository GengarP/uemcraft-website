<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title id="pageTitle">编辑服务器 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<a href="#main" class="skip-link">跳转到主内容</a>



<!-- ====== Admin Nav ====== -->
<div class="admin-nav">
  <div class="container admin-nav-inner">
    <a href="index.html" class="admin-nav-link">仪表盘</a>
    <a href="news.html" class="admin-nav-link">新闻管理</a>
    <a href="events.html" class="admin-nav-link">活动管理</a>
    <a href="gallery.html" class="admin-nav-link">作品管理</a>
    <a href="servers.html" class="admin-nav-link is-active">服务器管理</a>
    <a href="images.html" class="admin-nav-link">图片管理</a>
    <a href="wall.html" class="admin-nav-link">留言墙管理</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
  </div>
</div>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1 id="heroTitle">新增服务器</h1>
    <p class="hero-sub" id="heroSub">填写服务器信息并保存</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <a href="servers.html">服务器</a> <span>/</span> <span id="crumbAction">新增</span>
    </nav>
  </div>
</section>

<section class="section">
  <div class="container">
    <form id="serverForm" class="admin-edit-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="inputName">服务器名称 <span class="required">*</span></label>
          <input type="text" id="inputName" class="form-input" placeholder="如：生存服" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="inputAddress">服务器地址 <span class="required">*</span></label>
          <input type="text" id="inputAddress" class="form-input" placeholder="play.uemcraft.cn" required maxlength="255">
          <small class="form-help">IP 或域名，通过 api.uemcraft.cn 查询状态</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputPort">端口号</label>
          <input type="number" id="inputPort" class="form-input" placeholder="默认 25565" min="0" max="65535">
          <small class="form-help">留空使用默认端口</small>
        </div>
        <div class="form-group">
          <label for="inputEdition">游戏版本</label>
          <select id="inputEdition" class="form-input">
            <option value="java">Java 版</option>
            <option value="bedrock">基岩版</option>
          </select>
          <small class="form-help">影响查询 API 端点和默认端口</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputNote">备注</label>
          <input type="text" id="inputNote" class="form-input" placeholder="如：1.21 主生存服" maxlength="255">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputFeatured">置顶</label>
          <select id="inputFeatured" class="form-input">
            <option value="0">否</option>
            <option value="1">是</option>
          </select>
          <small class="form-help">置顶服务器显示在首页 Hero 徽章</small>
        </div>
        <div class="form-group">
          <label for="inputHideAddress">隐藏地址</label>
          <select id="inputHideAddress" class="form-input">
            <option value="0">否</option>
            <option value="1">是</option>
          </select>
          <small class="form-help">隐藏后前端不展示真实 IP，查询经由后端代理</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSortOrder">排序权重</label>
          <input type="number" id="inputSortOrder" class="form-input" value="0" min="0">
          <small class="form-help">数值越小越靠前</small>
        </div>
      </div>

      <span id="formMessage" class="wall-form-message" role="status" aria-live="polite"></span>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        <a href="servers.html" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</section>

</main>


<script src="/js/components.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/admin-auth.js"></script>
<script defer src="/js/admin-edit.js"></script>
</body>
</html>
