<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title id="pageTitle">编辑文档 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>



<!-- ====== Admin Nav ====== -->
<div class="admin-nav">
  <div class="container admin-nav-inner">
    <a href="index.html" class="admin-nav-link">仪表盘</a>
    <a href="news.html" class="admin-nav-link">新闻管理</a>
    <a href="events.html" class="admin-nav-link">活动管理</a>
    <a href="gallery.html" class="admin-nav-link">作品管理</a>
    <a href="docs.html" class="admin-nav-link is-active">文档管理</a>
    <a href="servers.html" class="admin-nav-link">服务器管理</a>
    <a href="images.html" class="admin-nav-link">图片管理</a>
    <a href="wall.html" class="admin-nav-link">留言墙管理</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
  </div>
</div>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1 id="heroTitle">新建文档</h1>
    <p class="hero-sub" id="heroSub">填写文档信息并保存</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <a href="docs.html">文档</a> <span>/</span> <span id="crumbAction">新建</span>
    </nav>
  </div>
</section>

<section class="section">
  <div class="container">
    <form id="docsForm" class="admin-edit-form" novalidate>
      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputTitle">标题 <span class="required">*</span></label>
          <input type="text" id="inputTitle" class="form-input" placeholder="文档标题" required maxlength="255">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSlug">Slug <span class="required">*</span></label>
          <input type="text" id="inputSlug" class="form-input" placeholder="url-slug（字母、数字、连字符）" required pattern="[a-z0-9\-]+">
          <small class="form-help">用于 URL，如 <code>server-rules</code></small>
        </div>
        <div class="form-group">
          <label for="inputCategory">分类</label>
          <input type="text" id="inputCategory" class="form-input" placeholder="如：新手教程" list="categoryList" maxlength="100">
          <datalist id="categoryList"></datalist>
          <small class="form-help">相同分类的文档会自动归为一组</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSortOrder">排序</label>
          <input type="number" id="inputSortOrder" class="form-input" placeholder="0" value="0" min="0">
          <small class="form-help">数字越小越靠前</small>
        </div>
        <div class="form-group">
          <label for="inputStatus">状态</label>
          <select id="inputStatus" class="form-input">
            <option value="draft">草稿</option>
            <option value="published">已发布</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputContent">正文 <span class="required">*</span></label>
          <textarea id="inputContent" class="form-textarea admin-content-textarea" rows="25" placeholder="Markdown 格式正文"></textarea>
          <small class="form-help">支持 Markdown 语法，标题（h2/h3）会自动生成右侧目录</small>
        </div>
      </div>

      <span id="formMessage" class="wall-form-message" role="status" aria-live="polite"></span>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        <a href="docs.html" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</section>

</main>


<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/admin-auth.js"></script>
<script defer src="/js/admin-edit.js"></script>
</body>
</html>
