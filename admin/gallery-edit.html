<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title id="pageTitle">编辑作品 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>



<!-- ====== Admin Nav ====== -->
<div class="admin-nav">
  <div class="container admin-nav-inner">
    <a href="index.html" class="admin-nav-link">仪表盘</a>
    <a href="news.html" class="admin-nav-link">新闻管理</a>
    <a href="events.html" class="admin-nav-link">活动管理</a>
    <a href="gallery.html" class="admin-nav-link is-active">作品管理</a>
    <a href="servers.html" class="admin-nav-link">服务器管理</a>
    <a href="images.html" class="admin-nav-link">图片管理</a>
    <a href="wall.html" class="admin-nav-link">留言墙管理</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
  </div>
</div>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1 id="heroTitle">新建作品</h1>
    <p class="hero-sub" id="heroSub">填写作品信息并保存</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <a href="gallery.html">作品</a> <span>/</span> <span id="crumbAction">新建</span>
    </nav>
  </div>
</section>

<section class="section">
  <div class="container">
    <form id="workForm" class="admin-edit-form" novalidate>
      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputTitle">标题 <span class="required">*</span></label>
          <input type="text" id="inputTitle" class="form-input" placeholder="作品标题" required maxlength="255">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSlug">Slug <span class="required">*</span></label>
          <input type="text" id="inputSlug" class="form-input" placeholder="url-slug" required pattern="[a-z0-9\-]+">
        </div>
        <div class="form-group">
          <label for="inputStatus">状态</label>
          <select id="inputStatus" class="form-input">
            <option value="published">已发布</option>
            <option value="draft">草稿</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputCover">封面图 URL</label>
          <input type="text" id="inputCover" class="form-input" placeholder="/assets/img/gallery/xxx.jpg">
          <small class="form-help">卡片列表中显示的缩略图</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputImage">大图 URL</label>
          <input type="text" id="inputImage" class="form-input" placeholder="/assets/img/gallery/xxx-large.jpg">
          <small class="form-help">Lightbox 中展示的高清大图，留空则使用封面图</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputCategory">分类</label>
          <input type="text" id="inputCategory" class="form-input" list="categoryList" placeholder="输入或选择分类">
          <datalist id="categoryList"></datalist>
          <small class="form-help">可输入新分类或从已有分类中选择</small>
        </div>
        <div class="form-group">
          <label for="inputAuthor">作者</label>
          <input type="text" id="inputAuthor" class="form-input" placeholder="作品作者">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputSortOrder">排序权重</label>
          <input type="number" id="inputSortOrder" class="form-input" value="0" min="0">
          <small class="form-help">数值越小越靠前</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputDescription">简短描述</label>
          <textarea id="inputDescription" class="form-textarea" rows="3" placeholder="作品简介（卡片中显示）" maxlength="1000"></textarea>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group--full">
          <label for="inputMarkdown">详细描述（Markdown）</label>
          <textarea id="inputMarkdown" class="form-textarea" rows="12" placeholder="支持 Markdown 格式，详情页中展示"></textarea>
          <small class="form-help">支持 Markdown 语法，详情页中渲染为富文本</small>
        </div>
      </div>

      <!-- 相册图片管理 -->
      <div class="form-row">
        <div class="form-group form-group--full">
          <label>相册图片</label>
          <div id="galleryImagesList" class="dynamic-list"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="addGalleryImage" style="margin-top:var(--space-sm);">+ 添加图片</button>
          <small class="form-help">添加多张图片 URL，详情页中以相册形式展示</small>
        </div>
      </div>

      <!-- 下载链接管理 -->
      <div class="form-row">
        <div class="form-group form-group--full">
          <label>下载链接</label>
          <div id="downloadLinksList" class="dynamic-list"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="addDownloadLink" style="margin-top:var(--space-sm);">+ 添加链接</button>
          <small class="form-help">添加下载按钮，每个链接需要填写名称和 URL</small>
        </div>
      </div>

      <span id="formMessage" class="wall-form-message" role="status" aria-live="polite"></span>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        <a href="gallery.html" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</section>

</main>


<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/admin-auth.js"></script>
<script defer src="/js/admin-edit.js"></script>
</body>
</html>
