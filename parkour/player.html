<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="UEMCraft 跑酷玩家数据——查看个人最佳成绩与排名趋势。">
  <meta name="theme-color" content="#213d87">
  <title>玩家数据 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=916f01c">
  <link rel="stylesheet" href="/css/base.css?v=916f01c">
  <link rel="stylesheet" href="/css/layout.css?v=916f01c">
  <link rel="stylesheet" href="/css/components.css?v=916f01c">
  <link rel="stylesheet" href="/css/pages.css?v=916f01c">
</head>
<body>
<script src="/js/components-header.js?v=916f01c"></script>

<a href="#main" class="skip-link">跳转到主内容</a>

<main id="main">
<section class="page-hero">
  <div class="container">
    <h1 id="playerTitle">玩家数据</h1>
    <p class="hero-sub" id="playerSub">加载中…</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="/parkour/">跑酷排行</a> <span>/</span> <span id="playerCrumb">玩家数据</span>
    </nav>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div id="playerStatus" class="wall-loading">正在加载…</div>

    <div id="playerCard" class="parkour-player-card" style="display:none;">
      <img id="playerAvatar" class="parkour-avatar-lg" src="" alt="">
      <div>
        <h2 id="playerName"></h2>
        <div id="playerSummary" class="text-muted"></div>
      </div>
    </div>

    <h3 style="margin-top:1.5rem;">地图表现</h3>
    <div class="parkour-table-wrap">
      <table class="parkour-ranking">
        <thead>
          <tr>
            <th>地图</th>
            <th>最好成绩</th>
            <th>死亡</th>
            <th>排名</th>
            <th>次数</th>
          </tr>
        </thead>
        <tbody id="mapBody"></tbody>
      </table>
    </div>

    <h3 style="margin-top:1.5rem;">排名趋势</h3>
    <div id="trendWrap" class="parkour-trend"></div>

    <h3 style="margin-top:1.5rem;">最近成绩</h3>
    <div class="parkour-table-wrap">
      <table class="parkour-ranking">
        <thead>
          <tr>
            <th>地图</th>
            <th>成绩</th>
            <th>死亡</th>
            <th>当时排名</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody id="trendBody"></tbody>
      </table>
    </div>
  </div>
</section>
</main>

<script src="/js/components-footer.js?v=916f01c"></script>
<script defer src="/js/utils.js?v=916f01c"></script>
<script defer src="/js/cjk-spacing.js?v=916f01c"></script>
<script defer src="/js/nav.js?v=916f01c"></script>
<script defer src="/js/page-transition.js?v=916f01c"></script>
<script defer src="/js/theme.js?v=916f01c"></script>
<script defer src="/js/parkour-player.js?v=916f01c"></script>
</body>
</html>
