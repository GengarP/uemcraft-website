<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="UEMCraft 留言墙——留下你的足迹，与同好们分享想法与祝福。">
  <meta name="theme-color" content="#213d87">
  <title>留言墙 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main">

<!-- Page Hero -->
<section class="page-hero">
  <div class="container">
    <h1>留言墙</h1>
    <p class="hero-sub">留下你的足迹，与同好们分享想法与祝福</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <span>留言墙</span>
    </nav>
  </div>
</section>

<!-- Post Form -->
<section class="section section-alt">
  <div class="container">
    <div class="section-head reveal">
      <span class="section-label">WRITE</span>
      <h2>写留言</h2>
    </div>
    <div class="wall-form-wrap reveal">
      <form id="wallForm" class="wall-form" novalidate>
        <div class="form-group">
          <label for="wallName">昵称</label>
          <input type="text" id="wallName" class="form-input" placeholder="怎么称呼你？" maxlength="20" required>
          <div class="form-error">昵称长度需在 2–20 个字符之间</div>
        </div>
        <div class="form-group">
          <label for="wallContent">留言内容</label>
          <textarea id="wallContent" class="form-textarea" rows="4" placeholder="想对 UEMCraft 说点什么…" maxlength="500" required></textarea>
          <div class="wall-char-count"><span id="charCount">0</span> / 500</div>
          <div class="form-error">留言内容不能为空，且不能超过 500 个字符</div>
        </div>
        <div class="wall-form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">发表留言</button>
          <span id="formMessage" class="wall-form-message" role="status" aria-live="polite"></span>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- Message List -->
<section class="section">
  <div class="container">
    <div class="section-head reveal">
      <span class="section-label">MESSAGES</span>
      <h2>大家的留言</h2>
      <p class="text-muted">已有 <strong id="totalCount">0</strong> 条留言</p>
    </div>

    <div id="wallList" class="wall-list reveal">
      <div class="wall-loading">正在加载留言…</div>
    </div>

    <div id="wallPagination" class="wall-pagination" style="display:none;">
      <button class="btn btn-ghost btn-sm" id="prevPage" disabled>‹ 上一页</button>
      <span id="pageInfo" class="wall-page-info"></span>
      <button class="btn btn-ghost btn-sm" id="nextPage" disabled>下一页 ›</button>
    </div>
  </div>
</section>

</main>

<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/reveal.js"></script>
<script defer src="/js/wall.js"></script>
</body>
</html>
