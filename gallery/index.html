<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="UEMCraft 作品展示——欣赏应急管理大学 Minecraft 同好会的建筑、红石与地图创作。">
  <meta name="theme-color" content="#213d87">
  <title>作品展示 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main">

<section class="page-hero">
  <div class="container">
    <h1>作品展示</h1>
    <p class="hero-sub">用方块创造无限可能，这里是社群作品画廊</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <span>作品展示</span>
    </nav>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div class="gallery-filter" id="galleryFilter"></div>
    <div id="worksGrid" class="works-grid">
      <div class="wall-loading">正在加载作品…</div>
    </div>
  </div>
</section>

<!-- Submit CTA -->
<section class="section-sm">
  <div class="container">
    <div class="highlight-banner reveal">
      <h2>有作品想展示？</h2>
      <p>把你的 Minecraft 建筑、红石装置或精彩截图投稿给我们！</p>
      <div class="cta-row">
        <a href="/join.html" class="btn btn-gold btn-lg">联系宣传部</a>
      </div>
    </div>
  </div>
</section>

</main>

<!-- Lightbox -->
<div id="worksLightbox" class="lightbox" aria-modal="true" role="dialog" aria-label="作品预览">
  <button class="lightbox-close" aria-label="关闭">✕</button>
  <button class="lightbox-prev lightbox-nav" aria-label="上一张">&lt;</button>
  <button class="lightbox-next lightbox-nav" aria-label="下一张">&gt;</button>
  <div class="lightbox-body">
    <img class="lightbox-img" src="" alt="">
    <div class="lightbox-caption">
      <h3 class="lightbox-title"></h3>
      <p class="lightbox-desc"></p>
      <button class="btn btn-primary btn-sm lightbox-download">下载图片</button>
    </div>
  </div>
</div>

<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/reveal.js"></script>
<script defer src="/js/gallery.js"></script>
</body>
</html>
