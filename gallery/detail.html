<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="UEMCraft 作品详情——应急管理大学 Minecraft 同好会成员的创作展示。">
  <meta name="theme-color" content="#213d87">
  <title>作品详情 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
</head>
<body>

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main">

<!-- Page Hero -->
<section class="page-hero">
  <div class="container">
    <h1 id="detailTitle">作品详情</h1>
    <p class="hero-sub" id="detailSub">加载中…</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <a href="/gallery/">作品展示</a> <span>/</span> <span id="detailCrumb">作品详情</span>
    </nav>
  </div>
</section>

<!-- 全宽相册浏览 -->
<section class="section">
  <div class="container">
    <div class="detail-gallery-wrap" id="detailGalleryWrap" style="display:none;">
      <!-- 左箭头（画廊外部） -->
      <button class="detail-gallery-arrow detail-gallery-prev" id="galleryPrev" aria-label="上一张">&lt;</button>
      <!-- 主图画廊 -->
      <div class="detail-gallery-main" id="detailGallery">
        <div class="detail-gallery-track" id="galleryTrack"></div>
        <div class="detail-gallery-counter" id="galleryCounter"></div>
      </div>
      <!-- 右箭头（画廊外部） -->
      <button class="detail-gallery-arrow detail-gallery-next" id="galleryNext" aria-label="下一张">&gt;</button>
    </div>
    <div class="detail-hero-thumbs" id="galleryThumbs"></div>
  </div>
</section>

<!-- 双栏详情区 -->
<section class="section section-alt">
  <div class="container">
    <div class="detail-layout">

      <!-- 主栏：Markdown 描述 -->
      <div class="detail-main">
        <article class="detail-body" id="detailBody"></article>
      </div>

      <!-- 侧栏 -->
      <aside class="detail-sidebar">
        <div class="detail-sidebar-inner">
          <!-- 头部信息 -->
          <div class="detail-sidebar-header">
            <h2 class="detail-sidebar-title" id="sidebarTitle"></h2>
            <div class="detail-sidebar-meta">
              <span class="detail-sidebar-category badge" id="sidebarCategory"></span>
              <span class="detail-sidebar-author" id="sidebarAuthor"></span>
            </div>
          </div>

          <!-- 简短描述 -->
          <div class="detail-sidebar-desc" id="detailDescCard" style="display:none;">
            <p class="detail-desc-text" id="detailDescText"></p>
          </div>

          <!-- 弹性间隔，将底部操作推到底部 -->
          <div class="detail-sidebar-spacer"></div>

          <!-- 底部操作区 -->
          <div class="detail-sidebar-actions">
            <!-- 下载按钮 -->
            <div class="detail-downloads" id="detailDownloads" style="display:none;">
              <div id="downloadButtons"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 返回按钮（独立 grid 子元素，移动端通过 CSS order 放到底部） -->
      <div class="detail-back-wrap">
        <a href="/gallery/" class="btn btn-outline btn-block detail-back-btn" id="detailBackBtn">← 返回作品列表</a>
      </div>

    </div>
  </div>
</section>

</main>

<!-- Lightbox -->
<div class="lightbox" id="worksLightbox" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
  <button class="lightbox-close" aria-label="关闭">&times;</button>
  <button class="lightbox-prev lightbox-nav" aria-label="上一张">&lt;</button>
  <button class="lightbox-next lightbox-nav" aria-label="下一张">&gt;</button>
  <div class="lightbox-body">
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
  </div>
</div>

<!-- Markdown 引擎 -->
<script defer src="/js/marked.umd.js"></script>

<!-- 作品详情逻辑 -->
<script src="/js/components.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/code-highlight.js"></script>
<script defer src="/js/gallery-detail.js"></script>

<!-- 全局交互脚本 -->
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/reveal.js"></script>

</body>
</html>
