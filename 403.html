<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>403 禁止访问 — UEMCraft</title>
  <link rel="icon" href="/favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=509b48d">
  <link rel="stylesheet" href="/css/base.css?v=509b48d">
  <link rel="stylesheet" href="/css/layout.css?v=509b48d">
  <link rel="stylesheet" href="/css/components.css?v=509b48d">
  <link rel="stylesheet" href="/css/pages.css?v=509b48d">
</head>
<body>

<a href="#main" class="skip-link">跳转到主内容</a>

<main id="main">
  <div class="page-403" id="d403">
    <div class="code-403">403</div>
    <h2>此处禁止进入</h2>
    <p class="text-muted text-lg" id="d403-msg">你好像闯进了别人的领地……<br>这块区域需要权限，而你暂时没有。</p>
    <div style="margin-top:var(--space-xl);display:flex;gap:var(--space-md);flex-wrap:wrap;justify-content:center;">
      <a href="/index.html" class="btn btn-primary btn-lg">返回首页</a>
      <a href="/join.html" class="btn btn-outline btn-lg">加入我们</a>
    </div>
  </div>
</main>

<script src="/js/components.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/reveal.js"></script>
<script>
(function(){
  // Random subtitle
  var msgs = [
    '你没有进入这个领地的权限。<br>——领地插件提示：此区域仅对主人与信任者开放。',
    '冒险模式不允许访问这里。<br>你需要 OP 权限。',
    '这里被屏障方块挡住了。<br>此区块仅对管理员开放。',
    '基岩挡住了去路。<br>在生存模式下，你无法破坏它。',
    '白名单检查失败。<br>你的名字不在这份名单上。',
    '权限节点缺失：uemcraft.access<br>请联系管理员。',
    '这块地已被圈地。<br>请输入 /res tp，或联系领地主人。',
    '这里不是冒险地图的出生点。<br>此区域禁止进入。',
  ];
  var el = document.getElementById('d403-msg');
  if (el) el.innerHTML = msgs[Math.floor(Math.random() * msgs.length)];

  // Random floating pixel blocks
  var container = document.getElementById('d403');
  if (!container) return;
  var colors = ['#5D8A3C','#966A3B','#7F7F7F','#F5A623','#4AEDD9','#C0392B','#214D87','#8E44AD','#27AE60'];
  var count = 8 + Math.floor(Math.random() * 8);
  var frag = document.createDocumentFragment();
  for (var i = 0; i < count; i++) {
    var block = document.createElement('div');
    block.className = 'd404-block';
    var size = 6 + Math.floor(Math.random() * 18);
    var top = Math.random() * 100;
    var left = Math.random() * 100;
    var delay = Math.random() * 3;
    var dur = 3 + Math.random() * 5;
    block.style.cssText =
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + colors[Math.floor(Math.random() * colors.length)] + ';' +
      'top:' + top + '%;left:' + left + '%;' +
      'animation-delay:' + delay + 's;' +
      'animation-duration:' + dur + 's;';
    frag.appendChild(block);
  }
  container.appendChild(frag);
})();
</script>
</body>
</html>
