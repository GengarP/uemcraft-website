<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="UEMCraft 活动中心——近期活动、往期回顾，了解应急管理大学 Minecraft 同好会的最新动态。">
  <meta name="theme-color" content="#213d87">
  <title>活动中心 — UEMCraft</title>
  <link rel="icon" href="/favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<script src="/js/components-header.js"></script>

<a href="#main" class="skip-link">跳转到主内容</a>

<!-- ====== Main ====== -->
<main id="main">

<!-- Page Hero -->
<section class="page-hero">
  <div class="container">
    <h1>活动中心</h1>
    <p class="hero-sub">精彩活动不间断，总有一款适合你</p>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="/index.html">首页</a> <span>/</span> <span>活动中心</span>
    </nav>
  </div>
</section>

<!-- Upcoming Events -->
<section class="section section-alt">
  <div class="container">
    <div class="section-head reveal">
      <span class="section-label">UPCOMING</span>
      <h2>近期活动</h2>
    </div>
    <div class="grid-2 reveal" id="eventUpcoming" style="max-width:900px;margin-inline:auto;"></div>
  </div>
</section>

<!-- Past Events -->
<section class="section">
  <div class="container">
    <div class="section-head reveal">
      <span class="section-label">REVIEW</span>
      <h2>往期回顾</h2>
    </div>
    <div class="grid-3 reveal" id="eventPast"></div>
  </div>
</section>

</main>

<script src="/js/components-footer.js"></script>
<script defer src="/js/utils.js"></script>
<script defer src="/js/cjk-spacing.js"></script>
<script defer src="/js/code-highlight.js"></script>
<script defer src="/js/content.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/page-transition.js"></script>
<script defer src="/js/theme.js"></script>
<script defer src="/js/reveal.js"></script>
<script defer src="/js/events.js"></script>
</body>
</html>
